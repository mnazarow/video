# CorpVideo — Docker Compose. Настройки берутся из .env (создаётся install.sh).
name: corpvideo

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
    target: app
  image: corpvideo/app:${CORPVIDEO_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    HOST: 0.0.0.0
    PORT: 3000
    DATA_DIR: /data
    DATABASE_URL: postgres://corpvideo:${DB_PASSWORD}@db:5432/corpvideo
    MEDIAMTX_API_URL: http://mediamtx:9997
    MEDIAMTX_HLS_URL: http://mediamtx:8888
    TRUST_PROXY: "true"
  volumes:
    - ${DATA_DIR:-/var/lib/corpvideo}:/data
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: corpvideo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: corpvideo
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - ${DATA_DIR:-/var/lib/corpvideo}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpvideo -d corpvideo"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    <<: *app
    command: ["node", "server/src/index.js"]
    expose: ["3000"]

  worker:
    <<: *app
    command: ["node", "server/src/worker.js"]
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
      DATABASE_URL: postgres://corpvideo:${DB_PASSWORD}@db:5432/corpvideo
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_ID: docker-worker

  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1.9.3}
    restart: unless-stopped
    user: "1000:1000"        # записи эфиров должны принадлежать пользователю приложения (node, uid 1000)
    ports:
      - "1935:1935"          # RTMP (OBS)
      - "8890:8890/udp"      # SRT
      - "8189:8189/udp"      # WebRTC ICE (эфир из браузера)
      - "8189:8189/tcp"
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ${DATA_DIR:-/var/lib/corpvideo}/live:/data/live
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: nginx
    image: corpvideo/nginx:${CORPVIDEO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${DOMAIN:-_}
      API_UPSTREAM: api:3000
      MEDIAMTX_WEBRTC: mediamtx:8889
      MEDIA_ROOT: /data/media
      SSL_MODE: ${SSL_MODE:-none}
      SSL_CERT: ${SSL_CERT_PATH:-/etc/corpvideo/ssl/fullchain.pem}
      SSL_KEY: ${SSL_KEY_PATH:-/etc/corpvideo/ssl/privkey.pem}
      UPLOAD_CHUNK_LIMIT: 64m
    volumes:
      # Только медиафайлы: каталог данных целиком монтировать незачем — в нём лежат база и резервные копии
      - ${DATA_DIR:-/var/lib/corpvideo}/media:/data/media:ro
      - ${DATA_DIR:-/var/lib/corpvideo}/ssl:/etc/corpvideo/ssl:ro
      - ${DATA_DIR:-/var/lib/corpvideo}/letsencrypt:/etc/letsencrypt:ro
      - ${DATA_DIR:-/var/lib/corpvideo}/certbot:/var/www/certbot:ro
    # Рендер конфигурации из шаблона, затем nginx; раз в 6 часов — reload (подхват продлённых сертификатов)
    command: ["/bin/bash", "-c", "/docker-entrypoint.d/99-corpvideo.sh && (while :; do sleep 6h; nginx -s reload 2>/dev/null; done &) && exec nginx -g 'daemon off;'"]
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  certbot:
    image: certbot/certbot
    profiles: ["letsencrypt"]
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/var/lib/corpvideo}/letsencrypt:/etc/letsencrypt
      - ${DATA_DIR:-/var/lib/corpvideo}/certbot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
