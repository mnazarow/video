# CorpVideo — переменные nginx (подключается в контексте http)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
map $uri $corpvideo_media_cache {
  ~*\.m3u8$            "no-cache";
  ~*\.(ts|m4s|mp4)$    "private, max-age=604800, immutable";
  default              "private, max-age=86400";
}
